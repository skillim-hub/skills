[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "event-webinar-promoter"
version = "2.1.0"
description = "Plan and promote events and webinars for Israeli audiences with timezone-aware scheduling and Hebrew copy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["events", "webinars", "israel", "hebrew", "marketing", "timezone"]
dependencies = ["click>=8.0"]

[project.scripts]
event-webinar-promoter = "event_webinar_promoter.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["event_webinar_promoter*"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
