[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-return-filing-assistant"
version = "2.2.0"
description = "Offline helper for Israeli tax return filing workflows covering Forms 1301, 135, 126, 856, and 6111."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "click>=8.1"
]
keywords = ["israel", "tax", "income-tax", "1301", "135", "126", "856", "6111"]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21"
]

[project.scripts]
tax-return-filing-assistant = "tax_return_filing_assistant_cli:main"

[tool.setuptools]
py-modules = ["tax_return_filing_assistant_client", "tax_return_filing_assistant_cli"]

[tool.setuptools.package-dir]
"" = "scripts"

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
