[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foreign-currency-invoicing"
version = "2.2.0"
description = "Israeli foreign-currency invoicing helper with Bank of Israel rate parsing and VAT calculations."
requires-python = ">=3.10"
dependencies = [
  "click>=8.1"
]
license = { text = "MIT" }
readme = "README.md"
keywords = ["israel", "vat", "invoice", "exchange-rate", "bank-of-israel"]

[project.scripts]
foreign-currency-invoicing = "foreign_currency_invoicing_cli:main"

[tool.setuptools]
py-modules = ["foreign_currency_invoicing_client", "foreign_currency_invoicing_cli"]

[tool.setuptools.package-dir]
"" = "scripts"

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
pythonpath = ["scripts"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
