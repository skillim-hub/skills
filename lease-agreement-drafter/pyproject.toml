[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lease-agreement-drafter"
version = "1.3.0"
description = "Draft and audit Israeli apartment and office lease agreement drafts."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["typer>=0.12"]
keywords = ["lease", "rental", "israel", "hebrew", "contract"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[project.scripts]
lease-agreement-drafter = "lease_agreement_drafter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lease_agreement_drafter*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["scripts"]
asyncio_mode = "auto"
