[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driving-license-booker"
version = "1.3.0"
description = "Workflow helper for Israeli driving-license renewal and appointment coordination"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["click>=8.1"]
keywords = ["israel", "driving-license", "appointments", "workflow", "hebrew"]
[project.scripts]
driving-license-booker = "driving_license_booker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
pythonpath = ["src"]
asyncio_mode = "auto"
