[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-compliance-advisor"
version = "2.2.0"
description = "Offline Israeli HR compliance triage helper."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["israel", "labor-law", "hr", "payroll", "compliance"]
dependencies = ["typer>=0.9", "click>=8"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "typer>=0.9", "click>=8"]

[project.scripts]
hr-compliance-advisor = "hr_compliance_advisor.cli:app"

[tool.setuptools.packages.find]
include = ["hr_compliance_advisor*"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "2.2.0"
