[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "social-media-manager"
version = "2.1.0"
description = "Planning, validation and scheduling helper for Hebrew-first Israeli organic social-media content."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "click>=8.1"
]
keywords = [
  "social-media",
  "hebrew",
  "rtl",
  "israel",
  "scheduling",
  "facebook",
  "instagram",
  "tiktok",
  "linkedin"
]

[project.scripts]
social-media-manager = "social_media_manager_cli:cli"

[tool.setuptools]
py-modules = ["social_media_manager_client", "social_media_manager_cli"]

[tool.setuptools.package-dir]
"" = "scripts"

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
addopts = "-q"
asyncio_mode = "strict"

[tool.ruff]
line-length = 120
target-version = "py310"
