[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hebrew-voice-to-text-skill"
version = "2.2.0"
description = "Hebrew voice-to-text skill package with workflows, CLI helpers, examples, and tests."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["click>=8.0"]

[project.scripts]
hebrew-voice-to-text = "hebrew_voice_to_text.cli:main"

[tool.setuptools.packages.find]
include = ["hebrew_voice_to_text*"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
