[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "passport-id-scheduler"
version = "2.2.0"
description = "Local helper for Israeli passport, Teudat Zehut, biometric document appointment planning."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["typer>=0.9.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
passport-id-scheduler = "passport_id_scheduler_cli:main"

[tool.setuptools]
py-modules = ["passport_id_scheduler_client", "passport_id_scheduler_cli"]

[tool.setuptools.package-dir]
"" = "scripts"

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
