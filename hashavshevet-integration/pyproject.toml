[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hashavshevet-integration"
version = "3.0.0"
description = "Hashavshevet integration utilities for Israeli accounting data workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "httpx>=0.24",
  "typer>=0.9",
  "click>=8.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0"
]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
addopts = "-q"
