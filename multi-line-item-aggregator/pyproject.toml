[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-line-item-aggregator"
version = "2.2.0"
description = "Aggregate multi-line Israeli invoices with discounts, per-line VAT, and fractional agorot handling."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["invoice", "vat", "israel", "discount", "rounding", "agorot"]
dependencies = ["click>=8.1"]

[project.scripts]
multi-line-item-aggregator = "multi_line_item_aggregator.cli:main"

[tool.setuptools.packages.find]
include = ["multi_line_item_aggregator*"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "2.2.0"
