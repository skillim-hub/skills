[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pension-contribution-calculator"
version = "1.2.0"
description = "Israeli pension, Keren Hishtalmut, and Bituach Menahalim contribution calculator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["israel", "pension", "payroll", "freelancer", "self-employed", "keren-hishtalmut", "bituach-menahalim"]
dependencies = [
  "typer>=0.9",
  "click>=8.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23"
]

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = ["pension_contribution_calculator_client"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
addopts = "-q"
