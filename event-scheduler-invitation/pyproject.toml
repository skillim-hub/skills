[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "event-scheduler-invitation"
version = "2.2.0"
description = "Israeli lifecycle event scheduler and Hebrew RSVP helper"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["typer>=0.12"]

[project.scripts]
event-scheduler-invitation = "event_scheduler_invitation.cli:main"

[tool.setuptools.packages.find]
include = ["event_scheduler_invitation*"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
