[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-generator"
version = "2.2.0"
description = "Israeli invoice, receipt, credit note, and allocation-number helper"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "requests>=2.31",
    "httpx>=0.24",
    "typer>=0.9",
]
keywords = [
    "israel",
    "invoice",
    "receipt",
    "credit-note",
    "vat",
    "shaam",
    "tax-allocation",
    "hebrew",
    "shaam-api",
    "israel-invoices",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
invoice-generator = "invoice_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_return_any = true
strict_optional = true
