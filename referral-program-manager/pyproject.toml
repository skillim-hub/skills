[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "referral-program-manager"
version = "1.2.0"
description = "Tools and documentation for Israeli referral program operations."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["referrals", "israel", "payments", "small-business", "loyalty", "rewards"]
dependencies = [
  "typer>=0.9",
  "click>=8.1"
]

[project.scripts]
referral-program-manager = "referral_program_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["scripts"]
python_files = ["test_*.py"]
pythonpath = ["src"]
