[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prepayment-deposit-handler"
version = "2.1.0"
description = "Workflow and CLI helper for Israeli deposits, advances, and final invoice settlement."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["israel", "vat", "deposit", "prepayment", "invoice", "receipt", "bookkeeping", "hebrew"]
dependencies = ["typer>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
prepayment-deposit-handler = "prepayment_deposit_handler_cli:main"

[tool.setuptools]
py-modules = ["prepayment_deposit_handler_client", "prepayment_deposit_handler_cli"]

[tool.setuptools.package-dir]
"" = "scripts"

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_return_any = true
