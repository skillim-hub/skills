[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-qualification-bot-skill"
version = "2.1.0"
description = "WhatsApp-first Hebrew lead qualification helpers for Israeli businesses."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "typer>=0.9.0"
]
keywords = ["lead qualification", "whatsapp", "hebrew", "israel", "crm", "small business"]

[project.scripts]
lead-qualification-bot = "lead_qualification_bot.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0"
]

[tool.setuptools.packages.find]
include = ["lead_qualification_bot*"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
addopts = "-q --color=no"
pythonpath = ["."]
