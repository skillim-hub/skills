[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "household-budget-planner"
version = "2.1.0"
description = "Israeli household, consumer, freelancer, and small-business budget planner."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "typer>=0.9",
  "click>=8.0"
]

[project.scripts]
household-budget-planner = "household_budget_planner.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21"
]

[tool.setuptools.packages.find]
include = ["household_budget_planner*"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["scripts"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
