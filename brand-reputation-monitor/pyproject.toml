[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brand-reputation-monitor"
version = "2.2.0"
description = "Neutral Hebrew brand reputation monitoring helper for permitted exports and local analysis."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["hebrew", "israel", "reputation", "sentiment", "social-listening", "privacy", "small-business"]
dependencies = [
  "typer>=0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
]

[project.scripts]
brand-reputation-monitor = "brand_reputation_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["brand_reputation_monitor*"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
