[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hebrew-email-formatter"
version = "2.2.0"
description = "Professional Hebrew email formatter for Israeli business and consumer correspondence."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
  "typer>=0.9"
]
keywords = ["hebrew", "email", "israel", "freelancer", "small-business", "ils"]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  "typer>=0.9",
  "ruff>=0.4",
  "mypy>=1.8"
]

[project.scripts]
hebrew-email-formatter = "hebrew_email_formatter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hebrew_email_formatter*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["scripts"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
ignore_missing_imports = true
