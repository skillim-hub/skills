[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "health-insurance-claim-tracker"
version = "1.2.0"
description = "Offline-first Israeli health-insurance claim and reimbursement tracker"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
  "israel",
  "health-insurance",
  "claims",
  "reimbursements",
  "cli",
  "hebrew"
]
dependencies = [
  "typer>=0.12.0",
]

[project.scripts]
hict = "health_insurance_claim_tracker.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["health_insurance_claim_tracker*"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
asyncio_mode = "strict"
addopts = "-q"
