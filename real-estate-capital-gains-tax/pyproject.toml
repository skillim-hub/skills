[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "real-estate-capital-gains-tax-assistant"
version = "0.2.1"
description = "Structured helper for estimating Israeli Mas Shevach on real-estate sales."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "typer>=0.9.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21"
]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.setuptools]
py-modules = ["real_estate_capital_gains_tax_client"]
packages = ["real_estate_capital_gains_tax"]
