[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "property-management-scheduler"
version = "2.2.0"
description = "Local-first scheduler for Israeli property management tasks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "typer>=0.9.0",
]
keywords = [
  "property-management",
  "israel",
  "rent",
  "maintenance",
  "tenant-communication",
  "landlord",
  "scheduler",
  "hebrew",
  "real-estate",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
property-management-scheduler = "property_management_scheduler.cli:app"

[tool.setuptools.packages.find]
include = ["property_management_scheduler*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["scripts"]
asyncio_mode = "auto"
