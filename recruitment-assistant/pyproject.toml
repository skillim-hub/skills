[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recruitment-assistant"
version = "0.4.0"
description = "Local helper for Israeli resume screening, role normalization, and interview scheduling."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["recruitment", "resume", "hebrew", "israel", "interviews"]
dependencies = [
  "typer>=0.12.0",
]

[project.scripts]
recruitment-assistant = "recruitment_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["recruitment_assistant*"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
addopts = "-q"
asyncio_mode = "auto"
