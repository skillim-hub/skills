[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-booking-assistant"
version = "2.2.0"
description = "Neutral Israeli travel booking assistant helper package."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["typer>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.21", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
travel-booking-assistant = "travel_booking_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["travel_booking_assistant*"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib -q"

[tool.ruff]
line-length = 100
target-version = "py310"
