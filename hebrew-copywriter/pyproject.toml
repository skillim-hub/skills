[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hebrew-copywriter-enhanced"
version = "2.2.0"
description = "Neutral Hebrew marketing copywriting skill package for Israeli audiences."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["click>=8.0"]
keywords = ["hebrew", "copywriting", "israel", "marketing", "localization"]

[project.scripts]
hebrew-copywriter = "hebrew_copywriter_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "typer>=0.12", "ruff>=0.5"]

[tool.setuptools]
py-modules = ["hebrew_copywriter_cli"]

[tool.setuptools.packages.find]
include = ["hebrew_copywriter*"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
