[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "free-text-invoice-explanation"
version = "2.1.0"
description = "Plain-language Hebrew and English invoice line explanations for Israeli small businesses, freelancers, and consumers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
  "invoice",
  "israel",
  "hebrew",
  "vat",
  "receipt",
  "credit-note",
  "small-business"
]
dependencies = [
  "typer>=0.9.0"
]

[project.scripts]
invoice-explain = "free_text_invoice_explanation.cli:main"

[tool.setuptools.packages.find]
include = ["free_text_invoice_explanation*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["scripts"]
python_files = ["test_*.py"]
