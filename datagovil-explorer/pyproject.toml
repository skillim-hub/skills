[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datagovil-explorer"
version = "2.2.0"
description = "Client, CLI, and guide for public data.gov.il CKAN datasets."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["click>=8.1"]
keywords = ["data.gov.il", "ckan", "open data", "israel", "csv", "verification"]

[project.urls]
Homepage = "https://data.gov.il"

[project.scripts]
datagovil-explorer = "datagovil_explorer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["datagovil_explorer*"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
addopts = "-q"
pythonpath = ["."]
