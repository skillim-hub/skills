[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trademark-patent-helper"
version = "2.1.0"
description = "Bilingual Israeli trademark and patent filing preparation helper."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "click>=8.1"
]
keywords = ["trademark", "patent", "israel", "intellectual-property", "hebrew"]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.8"
]

[project.scripts]
trademark-patent-helper = "trademark_patent_helper.cli:cli"

[tool.setuptools.packages.find]
include = ["trademark_patent_helper*"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false
