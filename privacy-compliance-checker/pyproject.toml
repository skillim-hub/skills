[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-compliance-checker"
version = "2.2.0"
description = "Structured privacy compliance helper for Israeli small-business workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "click>=8.0"
]
keywords = [
  "privacy",
  "compliance",
  "israel",
  "gdpr",
  "data-protection",
  "cli"
]

[project.scripts]
privacy-compliance-checker = "privacy_compliance_checker.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "mypy>=1.8",
  "ruff>=0.5"
]

[tool.setuptools.packages.find]
include = ["privacy_compliance_checker*"]

[tool.setuptools.package-data]
privacy_compliance_checker = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false
