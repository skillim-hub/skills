[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "real-estate-search"
version = "1.3.0"
description = "Structured Israeli real-estate search planning across Yad2, Madlan, and Komo with verified source paths"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.25",
  "typer>=0.9"
]
keywords = ["real estate", "Israel", "Yad2", "Madlan", "Komo", "rent", "sale", "commercial"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business"
]

[project.scripts]
real-estate-search = "real_estate_search.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
asyncio_mode = "auto"
addopts = "-q"
