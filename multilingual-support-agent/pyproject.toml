[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multilingual-support-agent"
version = "2.2.0"
description = "Multilingual support helper for Israeli small businesses, freelancers, and consumers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["customer-support", "israel", "hebrew", "arabic", "russian", "english", "rtl"]
dependencies = ["typer>=0.9"]

[project.scripts]
multilingual-support-agent = "multilingual_support_agent.cli:main"

[tool.setuptools.packages.find]
include = ["multilingual_support_agent*"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
asyncio_mode = "auto"
