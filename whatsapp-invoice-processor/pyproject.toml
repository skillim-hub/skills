[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-invoice-processor"
version = "0.4.0"
description = "Process WhatsApp invoice OCR text and produce structured Israeli invoice confirmations."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["typer>=0.12", "click>=8.1"]
keywords = ["whatsapp", "invoice", "ocr", "vat", "israel", "hebrew", "bookkeeping"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Topic :: Office/Business :: Financial :: Accounting"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "typer>=0.12", "click>=8.1"]

[project.scripts]
whatsapp-invoice-processor = "whatsapp_invoice_processor.cli:main"

[tool.setuptools.packages.find]
include = ["whatsapp_invoice_processor*"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
