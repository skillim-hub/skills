[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-chatbot-skill"
version = "2.2.0"
description = "Web-validated Hebrew sales chatbot helper for Israeli pricing, installments, upsell, cross-sell, and service handoff."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "typer>=0.12"]

[project.scripts]
sales-chatbot = "sales_chatbot_cli:main"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = ["sales_chatbot_client", "sales_chatbot_cli"]
packages = ["sales_chatbot"]

[tool.setuptools.package-data]
sales_chatbot = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
pythonpath = ["scripts"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"
