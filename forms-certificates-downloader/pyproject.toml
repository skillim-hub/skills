[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forms-certificates-downloader"
version = "2.2.0"
description = "Download and version-track public Israeli government forms and certificates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "beautifulsoup4>=4.12",
  "click>=8.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
forms-certificates-downloader = "forms_certificates_downloader.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["forms_certificates_downloader*"]

[tool.setuptools.package-data]
forms_certificates_downloader = ["data/portal-registry.json"]

[tool.pytest.ini_options]
minversion = "2.2.0"
testpaths = ["scripts"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "2.2.0"
ignore_missing_imports = true
check_untyped_defs = true
