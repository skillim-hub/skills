[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-manager"
version = "2.2.0"
description = "Israeli expense classification and accountant package helper"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "typer>=0.9",
]

[project.scripts]
expense-manager = "expense_manager.cli:main"

[tool.setuptools]
packages = ["expense_manager", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["scripts"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
