[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benefit-perk-planner"
version = "2.1.0"
description = "Israeli benefit and perk planner for small businesses, freelancers, consumers, and employees."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "typer>=0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
  "typer>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-q"

[tool.setuptools]
py-modules = ["benefit_perk_planner_client", "benefit_perk_planner_cli"]

[tool.setuptools.package-dir]
"" = "scripts"

[project.scripts]
benefit-perk-planner = "benefit_perk_planner_cli:app"
